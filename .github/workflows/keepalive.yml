name: Qdrant Keep-Alive

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install qdrant-client
        run: pip install qdrant-client==1.9.2

      - name: Ping Qdrant cluster
        env:
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
        run: python scripts/keepalive_qdrant.py
